<!doctype html>
<html lang="it"><head><meta charset="utf-8"><title>Segno bentornato</title>
<style>html,body{margin:0;padding:0;background:#fff6f1;overflow:hidden}svg{display:block}</style></head>
<body>
<svg id="scena" width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="base.js"></script>
<script>
/* ===== SEGNO EMOTIVO: copia di segno() di base.js con tre aggiunte (base.js NON è toccato) =====
   1. OCCHIO CONTINUO: un'unica forma chiusa (4 curve) riempita e bordata dello stesso colore.
      Parametri {rx, a, b, dy, punta, tilt}: a = quanto sale l'arco alto, b = quanto scende l'arco basso.
      a=b>0 ovale aperto · a=b≈0 riga (palpebra chiusa) · a>0,b=-a arco felice ∩ · a<0,b=-a arco chiuso ∪
      punta=1 → goccia (cima appuntita) inclinata di tilt verso il centro. Tutto si interpola con mix():
      nessun cambio di disegno, quindi nessun salto tra un tipo di occhio e l'altro.
   2. RISVOLTO CONTINUO: la curvatura del bordo passa da +5 (calato) a −4 (alzato) senza scatto
      quando il risvolto attraversa la cerniera (in base.js salta di colpo a Ll+Lr=0).
   3. occhioR: scala del solo occhio destro (un occhio più grande / che si apre per primo). */
const EA={rx:5.1,a:7.5,b:7.5,dy:0,punta:0,tilt:0,arco:0};   // ovale aperto (= ellisse 7.2×9.6 di base col bordo)
const EF={rx:7,a:5,b:-5,dy:3,punta:0,tilt:0,arco:1};        // felice ∩ (= "q7 -10 14 0")
const EC={rx:7,a:-3.5,b:3.5,dy:0,punta:0,tilt:0,arco:1};    // chiuso ∪, dorme (= "q7 7 14 0")
const EG={rx:5.3,a:8.4,b:7.2,dy:0,punta:1,tilt:12,arco:0};  // goccia, "ti capisce"
const ER={rx:6.2,a:.45,b:.45,dy:.5,punta:0,tilt:0,arco:.5};  // riga: palpebra giù a metà battito
const BE={esse:6,piega:0,incl:0,sy:1,sx:1,risvolto:[17,15],g:[1,1],piedi:[[0,0],[0,0]],occhioK:1,occhioR:1,occhio:EA};
const SE={
  calma:   {...BE},
  capisce: {...BE, esse:4, piega:-22, incl:6, risvolto:[22,10], occhio:EG, g:[-1,2]},
  dorme:   {...BE, esse:0, piega:100, incl:-16, sy:.9, risvolto:[30,30], occhio:EC, g:[0,1]},
  gioia:   {...BE, esse:8, piega:-10, sy:1.04, risvolto:[-26,-32], occhio:EF, piedi:[[-6,-2],[6,-2]]},
  fiero:   {...BE, esse:0, sy:1.1, sx:.95, risvolto:[-30,-30], occhio:EF, piedi:[[-14,0],[14,0]]},
};
function spinaE(s){
  const pts=[],N=48,ds=H*s.sy/N; let x=100,y=186;
  for(let i=0;i<=N;i++){ const t=i/N;
    const th=s.incl+s.piega*t+s.esse*Math.sin(t*Math.PI*2);
    pts.push({x,y,th,t}); const r=th*Math.PI/180; x+=ds*Math.sin(r); y-=ds*Math.cos(r); }
  return pts;
}
function occhioE(x,y,o,rot,k){
  /* arco=0: ovale (maniglie d'ellisse); arco=1: arco di parabola come il "q7 -10 14 0" di base */
  const K=.5523, rx=o.rx*k, a=o.a*k, b=o.b*k, cy=y+o.dy*k, p=o.punta, q=o.arco||0;
  const sxA=lerp(rx,rx*2/3,q), syA=lerp(K,2/3,q), tA=lerp(K,1/3,q);
  const hsA=a*syA*(1-.35*p)+a*.25*p, ht=rx*tA*(1-p), hsB=b*syA, hb=rx*tA;
  const d=`M${f1(x-rx)} ${f1(cy)}C${f1(x-sxA)} ${f1(cy-hsA)} ${f1(x-ht)} ${f1(cy-a)} ${f1(x)} ${f1(cy-a)}`+
          `C${f1(x+ht)} ${f1(cy-a)} ${f1(x+sxA)} ${f1(cy-hsA)} ${f1(x+rx)} ${f1(cy)}`+
          `C${f1(x+sxA)} ${f1(cy+hsB)} ${f1(x+hb)} ${f1(cy+b)} ${f1(x)} ${f1(cy+b)}`+
          `C${f1(x-hb)} ${f1(cy+b)} ${f1(x-sxA)} ${f1(cy+hsB)} ${f1(x-rx)} ${f1(cy)}Z`;
  return `<path d="${d}" fill="${C.occhi}" stroke="${C.occhi}" stroke-width="${f1(4.2*Math.min(1.15,k))}" stroke-linejoin="round" transform="rotate(${f1(rot)} ${f1(x)} ${f1(y)})"/>`;
}
function segnoE(s){
  const P=spinaE(s),N=P.length-1,top=P[N];
  const iT=Math.round(N*TACCA/(H*s.sy));
  const [pl,pr]=s.piedi;
  const ps0=lato(P[0],-1,larg(0,s)+4),pd0=lato(P[0],1,larg(0,s)+4);
  const ps=[ps0[0]+pl[0],ps0[1]+pl[1]],pd=[pd0[0]+pr[0],pd0[1]+pr[1]];
  let d=`M${fp(ps)}`;
  for(let i=3;i<=N;i++) d+=`L${fp(lato(P[i],-1,larg(P[i].t,s)))}`;
  d+=`L${fp(lato(top,1,larg(1,s)))}`;
  for(let i=N-1;i>=3;i--) d+=`L${fp(lato(P[i],1,larg(P[i].t,s)))}`;
  d+=`L${fp(pd)}L${fp([P[iT].x,P[iT].y])}Z`;
  const iO=Math.round(N*(1-.3)),po=P[iO],r=po.th;
  const occhi=[-1,1].map(l=>{
    const c=lato(po,l,12),x=c[0]+s.g[0],y=c[1]+s.g[1];
    const k=s.occhioK*(l===1?s.occhioR:1);
    const oc=(l===-1&&s.occhioL)?s.occhioL:s.occhio;   // occhioL facoltativo: occhio sinistro diverso
    return occhioE(x,y,oc,r+l*-oc.tilt*oc.punta,k);
  }).join('');
  const [Ll,Lr]=s.risvolto,th=top.th,hw=larg(1,s);
  const hl=lato(top,-1,hw+1),hr=lato(top,1,hw+1);
  const el=lungo(hl,th,Ll),er=lungo(hr,th,Lr);
  const sum=Ll+Lr, sotto=sum>0, apri=sotto?0:6*clamp(-sum/40);
  const el2=lato({x:el[0],y:el[1],th},-1,apri),er2=lato({x:er[0],y:er[1],th},1,apri);
  const curva=sotto?5*clamp(sum/12):-4*clamp(-sum/12);
  const cm=lungo([(el2[0]+er2[0])/2,(el2[1]+er2[1])/2],th,curva);
  const risv=`<path d="M${fp(hl)}L${fp(el2)}Q${fp(cm)} ${fp(er2)}L${fp(hr)}Z" fill="${C.rovescio}" stroke="${C.rovescio}" stroke-width="3" stroke-linejoin="round"/>`;
  return (sotto?'':risv)+`<path d="${d}" fill="${C.corpo}" stroke="${C.corpo}" stroke-width="5" stroke-linejoin="round"/>`+occhi+(sotto?risv:'');
}
/* pone Segno in scena: piedi in (fx,fy), scala sc. Appoggio: quando il corpo è inclinato la punta
   più bassa resta sul suolo (niente piede che sprofonda nel pavimento). */
function piedeBasso(s){ const P=spinaE(s), [pl,pr]=s.piedi;
  const a=lato(P[0],-1,larg(0,s)+4), b=lato(P[0],1,larg(0,s)+4);
  return Math.max(a[1]+pl[1], b[1]+pr[1])-186; }
function poni(s,fx,fy,sc){ const dy=piedeBasso(s)*sc;
  return `<g transform="translate(${f1(fx)} ${f1(fy-dy)}) scale(${sc.toFixed(3)}) translate(-100 -186)">${segnoE(s)}</g>`; }
function ombraE(cx,cy,rx,ry){ return `<ellipse cx="${f1(cx)}" cy="${f1(cy)}" rx="${f1(rx)}" ry="${f1(ry)}" fill="${C.ombra}"/>`; }
const bump=(t,a,b,c,d)=>eIO(prog(t,a,b))*(1-eIO(prog(t,c,d)));   // 0 → 1 → 0 morbido

/* ============================================================
   SEGNO — Bentornato. DURATA 3,5 s. Solo gioia di rivederti, nessun accenno alla serie.
   0.00 dorme: piegato in avanti, risvolto calato come una coperta, respiro lento.
   0.75 si stiracchia nel sonno (anticipo: si raggomitola un filo).
   0.95 apre un occhio (assonnato, poi del tutto); 1.05 comincia a sollevarsi;
   1.25 apre l'altro occhio mentre la coperta-risvolto scivola via.
   1.40 si stira e sbadiglia: si allunga oltre la verticale, occhi strizzati, risvolto su
        come braccia alzate, un tremito al culmine.
   1.95 si rilassa in calma, il risvolto ricade con un rimbalzo.
   2.20 ti riconosce: occhi grandi, risvolto su come sopracciglia.
   2.38 anticipo (si schiaccia) · 2.50 saltello di gioia, risvolto alto, occhi felici · 2.78 atterra.
   2.85 saluta: onda del risvolto e della cima che si smorza; 3.40–3.50 fermo, felice.
   ============================================================ */
const DURATA=3.5;
const scena=document.getElementById('scena');
const SC=3.6, FX=520, FY=800;
const EY={rx:6.6,a:-1.6,b:1.6,dy:0,punta:0,tilt:0,arco:1};      // strizzati (sbadiglio): ∪ schiacciato
const EAs={rx:5.6,a:3.2,b:7,dy:1.2,punta:0,tilt:0,arco:0};       // assonnato: palpebra a metà
/* dorme di nastro3, girato un poco verso di te perché l'occhio che si apre per primo si veda */
const DORME={...SE.dorme, piega:75, incl:-20, sy:.9, esse:3, risvolto:[16,30]};
function stato(t){
  /* --- corpo: dorme → mezzo sollevato → stirato → calma --- */
  const meta={...DORME, piega:40, incl:-8, sy:.95, esse:2, risvolto:[14,12]};
  const stira={...BE, esse:0, piega:-7, incl:2, sy:1.15, sx:.88, risvolto:[-16,-22], piedi:[[-3,0],[3,0]]};
  const eS=u=>.5-.5*Math.cos(Math.PI*u);   // sinusoidale: più morbida della cubica nel mezzo
  const k1=eS(prog(t,1.0,1.5)), k2=eS(prog(t,1.34,1.86)), k3=eIO(prog(t,1.94,2.24));
  let s=mix(mix(mix(DORME,meta,k1),stira,k2),SE.calma,k3);
  /* respiro del sonno, e raggomitolarsi prima di svegliarsi */
  const sonno=1-k1, resp=Math.sin(t*Math.PI*2/1.25);
  s.sy*=1+.022*resp*sonno; s.piega+=3.5*resp*sonno; s.risvolto=[s.risvolto[0]+1.5*resp*sonno,s.risvolto[1]+1.5*resp*sonno];
  const rag=bump(t,.72,.88,.92,1.1);
  s.piega+=7*rag; s.sy-=.02*rag;
  /* tremito al culmine dello stiramento */
  const cul=bump(t,1.66,1.72,1.8,1.9);
  s.incl+=Math.sin(t*70)*.9*cul; s.sy+=.012*cul;
  /* --- occhi --- */
  const oL=eIO(prog(t,.95,1.07)), oL2=eIO(prog(t,1.12,1.24)), oR=eIO(prog(t,1.3,1.42));
  const yawn=bump(t,1.48,1.64,1.88,2.02);
  const fel=eIO(prog(t,2.56,2.7));
  const sveglio=o=>mix(o,EY,yawn);
  let L=mix(mix(EC,EAs,oL),EA,oL2), R=mix(EC,EA,oR);
  s.occhioL=mix(sveglio(L),EF,fel); s.occhio=mix(sveglio(R),EF,fel);
  s.g=mix(mix([2,2],[-2,0],eIO(prog(t,1.0,1.2))),[0,-1.5],eIO(prog(t,1.3,1.5)));
  /* riconosce: occhi grandi, risvolto su come sopracciglia */
  const ric=eOut(prog(t,2.18,2.3))*(1-eIO(prog(t,2.6,2.75)));
  s.occhioK=1+.22*ric+.08*molla(t-2.18,16,7);
  const rcR=eOut(prog(t,2.2,2.34));
  /* --- saltello --- */
  const an=bump(t,2.36,2.48,2.48,2.56);                 // anticipo: schiaccia
  const su=eIO(prog(t,2.48,2.6))*(1-eIO(prog(t,2.6,2.66))); // spinta → allunga
  const at=molla(t-2.78,15,6.5);                         // atterraggio: schiaccia e rimbalza
  s.sy*=1-.13*an+.13*su-.16*at; s.sx*=1+.11*an-.1*su+.12*at;
  s.piedi=[[s.piedi[0][0]-8*an+5*su-6*at,s.piedi[0][1]+9*su],[s.piedi[1][0]+8*an-5*su+6*at,s.piedi[1][1]+9*su]];
  /* risvolto: ricade dopo lo stiramento, poi sopracciglia, poi alto di gioia e saluto */
  const gio=eOut(prog(t,2.46,2.66));
  const ricadi=molla(t-2.1,11,5.5);
  let Ll=s.risvolto[0]+9*ricadi, Lr=s.risvolto[1]+9*ricadi;
  Ll=lerp(Ll,7,rcR*(1-gio)); Lr=lerp(Lr,5,rcR*(1-gio));
  /* saluto: onda che passa da un lato all'altro del risvolto, e la cima che ondeggia */
  const ond=bump(t,2.82,2.95,3.22,3.42), w=(t-2.82)*Math.PI*2*2.6;
  const gL=-26+12*Math.sin(w), gR=-30+12*Math.sin(w-1.3);
  Ll=lerp(Ll,lerp(-26,gL,ond),gio); Lr=lerp(Lr,lerp(-30,gR,ond),gio);
  s.risvolto=[Ll-6*molla(t-2.56,12,6), Lr-8*molla(t-2.58,12,6)];
  s.piega+=lerp(0,-8,gio)+9*Math.sin(w-.6)*ond; s.esse+=lerp(0,4,gio);
  s.incl+=2*Math.sin(w-1.2)*ond;
  return s;
}
function salto(t){ // altezza dei piedi da terra (px)
  if(t<2.56||t>2.78) return 0;
  const u=prog(t,2.56,2.78); return 74*4*u*(1-u);       // arco parabolico
}
function render(t){
  let o=`<rect width="1080" height="1080" fill="${C.fondo}"/>`;
  const s=stato(t), h=salto(t);
  const dorm=1-eIO(prog(t,1.05,1.6));
  o+=ombraE(FX+14*dorm,FY+8,(128-40*h/74)*s.sx,17-5*h/74);
  o+=poni(s,FX,FY-h,SC);
  scena.innerHTML=o;
}
window.render=render; window.DURATA=DURATA;
render(Number(new URLSearchParams(location.search).get('t')||0));
</script>
</body></html>
