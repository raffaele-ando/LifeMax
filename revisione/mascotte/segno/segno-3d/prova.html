<!doctype html><meta charset="utf-8">
<style>html,body{margin:0;background:#fff6f1}canvas{display:block}</style>
<canvas id="c" width="1080" height="1080"></canvas>
<script type="module">
import { creaSegno, scena, POSA0, traccia, simulaRisvolto } from './segno3d.js';
/* PROVA DI CARATTERE (4,8 s): il risvolto è vero e ha peso.
   0.0  respira tranquillo, sbatte le ciglia
   1.0  alza gli occhi verso il risvolto (sa che è lì)
   1.3  si carica (schiacciamento), 1.55 salta: in aria il risvolto galleggia su
   2.05 atterra: il risvolto gli sbatte sugli occhi. Pausa comica.
   2.6  scuote la testa: la stoffa vola via all'indietro e ricade al suo posto
   3.3  soddisfatto: inclina la testa, occhi felici, piccolo rimbalzo; 4.3 occhiolino */
const DURATA = 4.8;
const { r, s, cam } = scena(document.getElementById('c'));
const S = creaSegno(s);
const K = (...k) => traccia(k);
/* salto: posizione verticale con una vera parabola fra stacco e atterraggio */
const T0 = 1.55, T1 = 2.05, H = .55;
const y = t => (t > T0 && t < T1) ? 4 * H * ((t - T0) / (T1 - T0)) * (1 - (t - T0) / (T1 - T0)) : 0;
const sy = K([0,1],[1.0,1],[1.3,.82],[1.5,.86],[1.6,1.14],[1.8,1.04],[2.0,1.02],[2.08,.8],[2.2,1.04],[2.32,.98],[2.45,1],[3.3,1],[3.45,.93],[3.6,1.03],[3.75,1],[4.8,1]);
const respiro = t => .012 * Math.sin(t * 2 * Math.PI / 2.4);
/* scossa della testa: rollio della cima, oscillazione smorzata */
const scossa = t => t < 2.55 ? 0 : Math.sin((t - 2.55) * 26) * .32 * Math.exp(-(t - 2.55) * 4.2) * Math.min(1, (t - 2.55) * 12);
const piega = K([0,0],[1.0,0],[1.3,.12],[1.55,-.08],[1.8,-.12],[2.05,.05],[2.12,.22],[2.3,.08],[2.55,.05],[3.3,0],[3.6,-.06],[4.8,-.04]);
const lato = K([0,0],[3.2,0],[3.5,.16],[4.8,.14]);
/* il risvolto: angolo voluto (la fisica fa il resto). 2.5 rad ≈ steso sopra gli occhi come un sopracciglio */
const vuole = K([0,2.2],[1.0,2.2],[1.3,2.05],[2.05,2.3],[2.5,2.8],[2.6,2.75],[2.75,2.1],[3.3,2.0],[4.8,2.0]);
/* la scossa della testa dà al risvolto un colpo all'indietro */
const ris = simulaRisvolto(DURATA + .1, t => vuole(t) - (t > 2.55 && t < 2.85 ? 1.6 * Math.sin((t - 2.55) / .3 * Math.PI) : 0),
  t => y(t) + (sy(t) - 1) * 1.2, t => piega(t), { k: 48, c: 4.2, G: 30 });
const apri = K([0,1],[.55,1],[.6,.05],[.66,.05],[.75,1],[1.5,1],[1.62,.6],[1.75,-.9],[2.0,-.9],[2.06,.9],[2.5,.9],[2.58,.05],[2.9,.05],[3.0,1],[3.3,1],[3.42,-1],[4.15,-1],[4.8,-1]);
const apriD = K([0,1],[.55,1],[.6,.05],[.66,.05],[.75,1],[1.5,1],[1.62,.6],[1.75,-.9],[2.0,-.9],[2.06,.9],[2.5,.9],[2.58,.05],[2.9,.05],[3.0,1],[3.3,1],[3.42,-1],[4.15,-1],[4.25,-1],[4.32,.06],[4.48,.06],[4.58,-1],[4.8,-1]);
const sgY = K([0,0],[.95,0],[1.1,.07],[1.3,.06],[1.45,0],[3.3,0],[4.8,0]);
const occhioK = K([0,1],[1.0,1],[1.12,1.15],[1.4,1.1],[1.55,1],[2.06,1.2],[2.4,1.15],[2.6,1],[4.8,1]);
const piedi = K([0,0],[1.5,0],[1.62,-.05],[1.8,.1],[2.0,.02],[2.06,0],[4.8,0]);
function render(t) {
  const p = { ...POSA0 };
  p.y = y(t); p.sy = sy(t) + respiro(t); p.sx = 1 / Math.sqrt(p.sy);
  p.piega = piega(t); p.lato = lato(t) + scossa(t) * 1.4; p.latoBase = -scossa(t) * .25;
  p.risv = ris(t); p.risvInc = scossa(t) * .5 + lato(t) * .6;
  p.apriS = apri(t); p.apriD = apriD(t); p.sguardo = [0, sgY(t)]; p.occhioK = occhioK(t);
  const pd = piedi(t); p.piedeS = [pd * .6, pd]; p.piedeD = [pd * .6, pd * .8];
  p.giro = Math.sin(t * .9) * .08;
  S.posa(p); r.render(s, cam);
}
window.render = render; window.DURATA = DURATA; window.pronto = true; render(0);
</script>
