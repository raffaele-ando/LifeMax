<!doctype html><meta charset="utf-8"><body style="margin:0;background:#f4f2fb;font:13px system-ui">

<script src="germo4.js"></script>

const S=GERMO4.STATI;
g.innerHTML=S.map(s=>'<div>'+GERMO4.disegna(s.k)+'<b>'+s.n+'</b></div>').join('');
