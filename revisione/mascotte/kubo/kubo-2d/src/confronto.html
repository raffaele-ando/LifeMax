<!doctype html><meta charset="utf-8"><style>
body{margin:0;background:#f9f6f2;font-family:Inter,sans-serif;color:#1d2a62;width:1200px}
h1{font-size:30px;margin:28px 32px 4px}p.s{margin:0 32px 18px;font-size:16px;opacity:.7}
.row{display:grid;grid-template-columns:160px 500px 500px;align-items:center;margin:0 20px 14px}
.lab{font-weight:800;font-size:22px;padding-left:12px}.cell{width:480px;height:400px;border-radius:24px;background:#fff;overflow:hidden;position:relative}
.cell.k2d{background:#f9f6f2}.cell .orig{position:absolute;inset:0;background-repeat:no-repeat}.cell svg{width:480px;height:400px}
.head{display:grid;grid-template-columns:160px 500px 500px;margin:0 20px 6px;font-weight:700;font-size:16px;opacity:.6}
</style>
<h1>Kubo · originale e ridisegno 2D</h1><p class="s">A sinistra le immagini del generatore, a destra il disegno vettoriale piatto nella stessa posa (fondo dell'app #f9f6f2).</p>
<div class="head"><span></span><span>Originale</span><span>Kubo 2D (SVG)</span></div>
<div id="rows"></div>
<script src="rig.js"></script>
<script>
// crop: [file, x0,y0,x1,y1] in frazioni dell'immagine
const ORIG='../../kubo-zip/kubo/';
window.ROWS=[];
window.showRows=(rows)=>{const R=document.getElementById('rows');
for(const r of rows){const d=document.createElement('div');d.className='row';
const [f,x0,y0,x1,y1]=r.crop;const cw=480,ch=400;const w=x1-x0,h=y1-y0;const sc=Math.min(cw/w,ch/h);
const bw=sc,bh=sc;// background size in px of full image (normalized 1x1 assumed square-ish handled below)
d.innerHTML=`<div class="lab">${r.label}</div><div class="cell"><div class="orig"></div></div><div class="cell k2d">${KuboRig.build({viewBox:r.vb||'-450 -700 900 750',attrs:''})}</div>`;
R.appendChild(d);const o=d.querySelector('.orig');const img=new Image();img.src=ORIG+f;
img.onload=()=>{const W=img.width,H=img.height;const pw=w*W,ph=h*H;const s=Math.min(cw/pw,ch/ph);
o.style.backgroundImage=`url(${img.src})`;o.style.backgroundSize=`${W*s}px ${H*s}px`;
o.style.backgroundPosition=`${-x0*W*s+(cw-pw*s)/2}px ${-y0*H*s+(ch-ph*s)/2}px`;window.loaded=(window.loaded||0)+1;};
const svg=d.querySelectorAll('.cell')[1].firstElementChild;svg.setAttribute('preserveAspectRatio','xMidYMid meet');
KuboRig.applyPose({getElementById:id=>svg.querySelector('#'+id)},r.pose);
if(r.noSparks)svg.querySelector('#scintille').setAttribute('opacity',0);
if(r.feetFront){const k=svg.querySelector('#kubo');['piede-sinistro','piede-destro'].forEach(id=>k.appendChild(svg.querySelector('#'+id)));}
if(r.prop){const P=KuboRig.PALETTE;const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.innerHTML=PROPS[r.prop](P);
 if(r.propBehindHands){const k=svg.querySelector('#kubo');k.insertBefore(g,svg.querySelector('#mano-sinistra'));}else svg.querySelector('#kubo-scena').appendChild(g);}}};
const PROPS={
 laptop:P=>{const L=KuboRig.mix(P.blu,'#ffffff',0.45),D=KuboRig.mix(P.blu,'#ffffff',0.2);
  return `<path fill="${D}" d="M-70 -40 L290 -40 Q302 -40 296 -28 L282 4 Q278 14 266 14 L-90 14 Q-102 14 -98 4 L-82 -28 Q-78 -40 -70 -40Z"/>
  <path fill="${L}" d="M-20 -215 L250 -215 Q270 -215 267 -195 L250 -60 Q247 -40 227 -40 L-50 -40 Q-68 -40 -66 -60 L-44 -195 Q-41 -215 -20 -215Z"/>
  <path fill="${P.corpo}" d="M104 -158 L130 -128 L104 -98 L78 -128Z" opacity="0.9"/>`},
 puff:P=>`<g transform="translate(370 -120) scale(0.8)"><path fill="${P.ombra}" d="${KuboRig.smoothClosed([[-60,10],[-62,-20],[-40,-42],[-12,-40],[0,-62],[34,-64],[52,-40],[76,-36],[86,-8],[70,18],[40,26],[0,24],[-34,26]])}"/>
  <path fill="${P.mezzitoni}" d="${KuboRig.smoothClosed([[-40,4],[-42,-16],[-26,-30],[-6,-26],[6,-44],[30,-46],[42,-28],[60,-24],[66,-6],[52,8],[30,12],[0,10],[-24,12]])}"/></g>`,
};
</script>
