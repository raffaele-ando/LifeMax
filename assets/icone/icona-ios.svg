<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="LifeMax">
  <title>LifeMax</title>
  <defs>
    <linearGradient id="g" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5df0"/>
      <stop offset=".55" stop-color="#4a7bf5"/>
      <stop offset="1" stop-color="#2ab8e8"/>
    </linearGradient>
  </defs>
  <!-- Quadrata e senza trasparenze: iOS arrotonda da sé l'icona della schermata
       home. Se arrotondassimo anche noi, gli angoli resterebbero vuoti (iOS li
       compone su nero) e si vedrebbe un bordo scuro attorno al simbolo. -->
  <rect width="512" height="512" fill="url(#g)"/>
  <g fill="none" stroke="#fff" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
    <path d="M132 322l76-76 54 54 114-114"/>
    <path d="M304 188h74v74"/>
  </g>
</svg>
