<!-- pannello (bottom sheet su mobile, modale al centro su desktop) -->
<div class="sheet-overlay" id="sheet-overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-titolo" tabindex="-1">
    <!-- una via d'uscita sola: col dito la maniglia (si trascina giù o si
         tocca), col mouse la x. Averle entrambe insieme erano due comandi
         per la stessa cosa nello stesso angolo. -->
    <button class="sheet-maniglia" id="sheet-maniglia" aria-label="Chiudi"></button>
    <!-- se sei entrato qui da un altro pannello, la via del ritorno porta
         scritto il nome del posto da cui vieni -->
    <div class="sheet-testa">
      <div class="sheet-testa-sx">
        <button class="sheet-indietro" id="sheet-indietro" hidden></button>
        <h2 id="sheet-titolo"></h2>
      </div>
      <button class="sheet-chiudi" id="sheet-chiudi" aria-label="Chiudi"></button>
    </div>
    <div class="sheet-corpo" id="sheet-corpo"></div>
  </div>
</div>

<div class="overlay" id="overlay-cattura" hidden>
  <div class="pannello-cattura" role="dialog" aria-modal="true" aria-label="Cattura rapida" tabindex="-1">
    <div class="corpo-cattura" id="corpo-cattura">
      <input type="text" id="input-cattura" placeholder="Scrivi un pensiero…" autocomplete="off" enterkeyhint="done">
      <!-- col dito non c'è nessun tasto Invio a portata: serve un pulsante -->
      <button class="btn btn-primario cattura-salva" id="cattura-salva" type="button">Salva</button>
    </div>
    <!-- Una nota sola. Le due classi che sceglievano fra tastiera e dito
         erano rimaste nel markup dopo una ripulitura del CSS, quindi sul
         telefono si leggeva «Invio salva nell'inbox · Esc chiude»: le
         istruzioni per due tasti che lì non esistono. Quello che serve
         sapere è dove finisce la nota, e vale in tutti i casi. -->
    <div class="piede">
      <span>Finisce tra le cose da sistemare.</span>
      <button type="button" class="cattura-chiudi" id="cattura-chiudi">Chiudi</button>
    </div>
  </div>
