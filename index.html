<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>LifeMax — Misura. Ingegnerizza. Massimizza.</title>
<meta name="description" content="Sistema operativo personale per il miglioramento continuo: cattura istantanea, una sola prossima azione, misurazione a zero frizione, esperimenti N-of-1. Ogni scelta di design è motivata dalla letteratura scientifica.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='1' x2='1' y2='0'%3E%3Cstop offset='0' stop-color='%237c5df0'/%3E%3Cstop offset='.55' stop-color='%234a7bf5'/%3E%3Cstop offset='1' stop-color='%232ab8e8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='2' y='2' width='44' height='44' rx='13' fill='url(%23g)'/%3E%3Cpath d='M12 30.5l7-7 5 5L34.5 18' fill='none' stroke='white' stroke-width='4.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M27.5 17h7.5v7.5' fill='none' stroke='white' stroke-width='4.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icone/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icone/icona-192.png">
<!-- iOS ignora le favicon SVG quando si aggiunge alla schermata home: serve un PNG
     dedicato, quadrato e senza trasparenze (la maschera la disegna il sistema) -->
<link rel="apple-touch-icon" sizes="180x180" href="assets/icone/icona-180.png">
<link rel="apple-touch-icon" sizes="167x167" href="assets/icone/icona-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="assets/icone/icona-152.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="application-name" content="LifeMax">
<meta name="apple-mobile-web-app-title" content="LifeMax">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0a0d" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>

<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>

<div id="banda-demo" role="region" aria-label="Avviso dati di esempio"></div>

<div class="app">

  <!-- navigazione desktop -->
  <aside class="sidebar" aria-label="Navigazione principale">
    <div class="logo" id="logo-blocco">LifeMax <span class="logo-tag">Beta</span></div>
    <button class="cattura-cta" id="side-cattura" title="Cattura un pensiero (tasto C)">
      <span class="cattura-cta-testo"></span><kbd>C</kbd>
    </button>
    <nav id="nav-lato" aria-label="Sezioni"></nav>
    <div class="sidebar-fondo" id="sidebar-fondo"></div>
  </aside>

  <!-- contenuto -->
  <main class="main" id="vista" tabindex="-1"></main>
</div>

<!-- navigazione mobile -->
<nav class="tabbar" id="nav-tab" aria-label="Navigazione mobile"></nav>

<!-- cattura istantanea: sempre a un gesto di distanza -->
<button class="fab" id="fab-cattura" title="Cattura un pensiero (tasto C)" aria-label="Cattura un pensiero"></button>

<!-- pannello (bottom sheet su mobile, modale al centro su desktop) -->
<div class="sheet-overlay" id="sheet-overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-titolo">
    <div class="sheet-maniglia" aria-hidden="true"></div>
    <div class="sheet-testa"><h2 id="sheet-titolo"></h2><button class="sheet-chiudi" id="sheet-chiudi" aria-label="Chiudi"></button></div>
    <div class="sheet-corpo" id="sheet-corpo"></div>
  </div>
</div>

<div class="overlay" id="overlay-cattura" hidden>
  <div class="pannello-cattura" role="dialog" aria-modal="true" aria-label="Cattura rapida">
    <div class="corpo-cattura" id="corpo-cattura">
      <input type="text" id="input-cattura" placeholder="Scrivi un pensiero…" autocomplete="off" enterkeyhint="done">
      <!-- col dito non c'è nessun tasto Invio a portata: serve un pulsante -->
      <button class="btn btn-primario cattura-salva" id="cattura-salva" type="button">Salva</button>
    </div>
    <div class="piede">
      <span class="solo-tastiera"><kbd>Invio</kbd> salva nell'inbox &nbsp;·&nbsp; <kbd>Esc</kbd> chiude</span>
      <span class="solo-tocco">Finisce tra le cose da sistemare.</span>
      <span style="margin-left:auto">Niente categorie adesso: le sceglierai più tardi.</span>
    </div>
  </div>
</div>

<div class="toast-zona" id="toast-zona" aria-live="polite"></div>

<div id="onboarding-root"></div>

<!-- primo di tutti: così il registro cattura anche gli errori degli script che seguono -->
<script src="assets/log.js"></script>
<script src="assets/icons.js"></script>
<script src="assets/data.js"></script>
<script src="assets/charts.js"></script>
<script src="assets/app.js"></script>
<script type="module" src="assets/cloud.js"></script>
</body>
</html>
